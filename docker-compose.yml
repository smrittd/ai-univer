services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_university
      POSTGRES_USER: aiu
      POSTGRES_PASSWORD: aiu
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiu -d ai_university"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://aiu:aiu@db:5432/ai_university
      JWT_SECRET: ${JWT_SECRET:-development-only-secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
